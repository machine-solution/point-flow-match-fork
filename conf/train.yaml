seed: 1234
epochs: 1500
log_wandb: False
# Composer rolling saves: interval save_each_n_epochs, keep save_num_checkpoints_to_keep files.
# With checkpoint_schedule=milestones_1500 → epochs 300,600,900,1200,1500 only.
save_each_n_epochs: 300
save_num_checkpoints_to_keep: 5
checkpoint_milestones: []
task_name: unplug_charger
obs_features_dim: 256
y_dim: 10  # (xyz, rot6d, g)
x_dim: "${eval: '${obs_features_dim} + ${y_dim}'}"
n_obs_steps: 2
n_pred_steps: 32  # Must be divisible by 4
use_ema: True
obs_mode: pcd  # pcd | rgb
run_name: null  # optional explicit run name for this training run (no autoresume)
resume_from_ckpt_name: null  # if set, initialize model weights from ckpt/<name>/*
resume_from_ckpt_episode: latest  # e.g. latest, ep500, ep1000

# Если заданы, используются вместо demos/sim/<task_name>/{train,valid}
dataset_path_train: null
dataset_path_valid: null
# false → не грузим valid, eval_dataloader=None (Composer не гоняет eval по эпохам)
use_validation: true

# После trainer.fit() запустить bash/start_eval.sh (на кластере обычно выключить)
launch_eval_after_train: true

trainer:
  # Optional Composer max_duration override, e.g. 100ba for smoke runs.
  max_duration: null


# env_runner:
#   num_episodes: 20
#   max_episode_length: 200
#   task_name: ${task_name}
#   env_config:
#     seed: 1996
#     lowdim_obs: False


dataset:
  n_obs_steps: ${n_obs_steps}
  n_pred_steps: ${n_pred_steps}
  subs_factor: 3
  use_pc_color: False
  n_points: 4096


dataloader:
  batch_size: 128
  num_workers: 0
  # pin_memory: True


optimizer:
  _target_: torch.optim.AdamW
  lr: 3.0e-5
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

lr_scheduler:
  name: cosine  # constant | cosine | linear | ...
  num_warmup_steps: 5000


defaults:
  - model: flow
  - backbone: pointnet
  - checkpoint_schedule: milestones_1500
  # NOTE: avoid YAML 1.1 booleans ("on/off") in defaults
  - phase_conditioning: disabled
  - phase_prediction: disabled
  - phase_rollout: disabled