seed: 5678
log_wandb: False
# Optional path to write per-run JSON (scripts/validate_accuracy.py)
results_json: null

env_runner:
  num_episodes: 300
  max_episode_length: 200
  verbose: True
  env_config:
    voxel_size: 0.01
    headless: True
    vis: True


policy:
  ckpt_name: 1717446544-didactic-woodpecker
  ckpt_episode: ep1500  # latest, ep1500, ep1000
  num_k_infer: 50
  # Uncomment the following to override settings used during training
  # flow_schedule: linear  # linear | cosine | exp
  # exp_scale: 4.0

defaults:
  # NOTE: avoid YAML 1.1 booleans ("on/off") in defaults
  - phase_conditioning: disabled
  - phase_prediction: disabled
  - phase_rollout: disabled
