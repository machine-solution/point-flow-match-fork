_target_: pfp.policy.shortcut_fm_policy.ShortcutFMPolicy
x_dim: ${x_dim}
y_dim: ${y_dim}
n_obs_steps: ${n_obs_steps}
n_pred_steps: ${n_pred_steps}
num_k_infer: 1
time_conditioning: True
norm_pcd_center: [0.4, 0.0, 1.4]
augment_data: False
noise_type: gaussian
noise_scale: 1.0
loss_type: l2
flow_schedule: exp
exp_scale: 4.0
snr_sampler: uniform

obs_encoder: ${backbone}

shortcut:
  embed_dim: 128
  num_base_steps: 10
  base_loss_weight: 1.0
  consistency_loss_weight: 1.0
  stopgrad_target: true
  step_sampling: powers_of_two
  min_step: null
  max_step: 0.5

diffusion_net:
  _partial_: true
  _target_: diffusion_policy.model.diffusion.conditional_unet1d.ConditionalUnet1D
  global_cond_dim: "${eval: '${x_dim} * ${n_obs_steps} + ${model.shortcut.embed_dim}'}"
  diffusion_step_embed_dim: "${eval: '256 if ${model.time_conditioning} else 0'}"
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: True
  use_dropout: False

loss_weights:
  xyz: 10.0
  rot6d: 10.0
  grip: 1.0

use_gripper_motion_weights: false
gripper_motion_lambda: 3.0
gripper_motion_window: 1

phase_conditioning: ${phase_conditioning}
phase_prediction: ${phase_prediction}
phase_rollout: ${phase_rollout}
