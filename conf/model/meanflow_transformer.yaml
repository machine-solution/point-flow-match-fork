_target_: pfp.policy.meanflow_policy.MeanFlowPolicy
x_dim: ${x_dim}
y_dim: ${y_dim}
n_obs_steps: ${n_obs_steps}
n_pred_steps: ${n_pred_steps}
num_k_infer: 1
time_conditioning: True
norm_pcd_center: [0.4, 0.0, 1.4]
augment_data: False
noise_type: gaussian
noise_scale: 1.0
loss_type: l2
flow_schedule: exp
exp_scale: 4.0
snr_sampler: uniform

obs_encoder: ${backbone}

interval_embed_dim: 64
interval_hidden_dim: 128
meanflow:
  enabled: true
  one_step: true

diffusion_net:
  _partial_: true
  _target_: pfp.models.temporal_transformer.TemporalTransformerBackbone
  global_cond_dim: "${eval: '${x_dim} * ${n_obs_steps} + ${model.interval_embed_dim}'}"
  output_dim: ${y_dim}
  d_model: 128
  num_layers: 2
  num_heads: 4
  mlp_ratio: 2.0
  dropout: 0.0
  max_horizon: ${n_pred_steps}
  use_layer_norm: true

loss_weights:
  xyz: 10.0
  rot6d: 10.0
  grip: 1.0

use_gripper_motion_weights: false
gripper_motion_lambda: 3.0
gripper_motion_window: 1

phase_conditioning: ${phase_conditioning}
phase_prediction: ${phase_prediction}
phase_rollout: ${phase_rollout}
